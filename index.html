<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.O.C.H.I. 統合指令システム - 尾羽急電鉄</title>
    <style>
        :root {
            --bg-color: #0b1016;
            --panel-bg: #131a22;
            --border-color: #2a3744;
            --accent-green: #00ff88;
            --accent-red: #ff4444;
            --accent-yellow: #ffcc00;
            --accent-blue: #00bbff;
            --text-main: #e2e8f0;
            --text-dim: #829ab1;
            --rail-color: #4a657a;
            --rail-underground: #0077b6;
            --platform-color: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* ヘッダー */
        header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #0f141a; padding: 10px 15px;
            border-bottom: 1px solid var(--border-color); flex-shrink: 0;
        }
        .logo-area { display: flex; flex-direction: column; }
        h1 { margin: 0; font-size: 1.2rem; color: var(--accent-green); display: flex; align-items: center; gap: 8px; letter-spacing: 1px; }
        .sub-logo { font-size: 0.65rem; color: var(--text-dim); margin-top: 2px; }
        .clock { font-size: 1.2rem; font-family: monospace; font-weight: bold; }

        /* タブ */
        .tabs {
            display: flex; background: #0f141a; border-bottom: 1px solid var(--border-color);
            overflow-x: auto; flex-shrink: 0; -webkit-overflow-scrolling: touch; padding: 0 5px;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: transparent; border: none; color: var(--text-dim);
            padding: 12px 15px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
            border-bottom: 3px solid transparent; white-space: nowrap; transition: 0.2s;
        }
        .tab-btn.active { color: var(--accent-green); border-bottom-color: var(--accent-green); }

        /* メインレイアウト */
        .main-container {
            display: flex; flex: 1; overflow: hidden; flex-direction: row;
        }

        /* 1. マップエリア */
        .map-section {
            flex: 1; display: flex; flex-direction: column; position: relative;
            background: #0a0e13; border-right: 1px solid var(--border-color); overflow: hidden;
        }
        
        /* スクロール用の外枠 */
        .map-wrapper {
            width: 100%; height: 100%; overflow: auto; display: none;
            -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y;
            padding: 20px 0;
        }
        .map-wrapper.active { display: block; }
        
        /* 実際の路線図の大きさを持つ内枠 */
        .map-inner {
            position: relative; /* 列車アイコンの基準位置になります */
            margin: 0 auto; /* 中央寄せ */
        }
        .svg-map { display: block; pointer-events: none; position: absolute; top: 0; left: 0; }

        /* 列車アイコン */
        .train-icon {
            position: absolute; width: 36px; height: 36px;
            background: #1a2530; border: 2px solid var(--text-dim); border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-weight: bold; font-size: 0.65rem; cursor: pointer;
            transform: translate(-50%, -50%); z-index: 100; transition: border-color 0.2s, background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .train-icon.selected { border-color: var(--accent-green); background: #143322; box-shadow: 0 0 15px rgba(0,255,136,0.6); z-index: 150;}
        .train-icon.delayed { border-color: var(--accent-red); box-shadow: 0 0 15px rgba(255,68,68,0.6); }
        .train-icon.slow { border-color: var(--accent-yellow); box-shadow: 0 0 15px rgba(255,204,0,0.6); background: #332b00; }
        
        /* 抑止中の緊急アニメーション */
        @keyframes blink-stop {
            0% { box-shadow: 0 0 20px rgba(255,68,68,0.9); background: #4a0000; border-color: #ff0000; transform: translate(-50%, -50%) scale(1.1); }
            50% { box-shadow: 0 0 5px rgba(255,68,68,0.2); background: #1a2530; border-color: #aa2222; transform: translate(-50%, -50%) scale(1); }
            100% { box-shadow: 0 0 20px rgba(255,68,68,0.9); background: #4a0000; border-color: #ff0000; transform: translate(-50%, -50%) scale(1.1); }
        }
        .train-icon.stopped { animation: blink-stop 1.2s infinite; z-index: 200; }
        
        .t-type { font-size: 0.5rem; }

        /* 2. コントロールパネルエリア */
        .dashboard-section {
            width: 380px; display: flex; flex-direction: column;
            background: var(--panel-bg); flex-shrink: 0; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .panel-header {
            padding: 10px 15px; background: #0b1016; font-size: 0.85rem; font-weight: bold;
            color: var(--text-dim); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 10;
        }

        /* 運行状況モニター (リスト) */
        .train-list { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .list-item {
            background: #1c2530; border: 1px solid var(--border-color);
            padding: 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        @media (hover: hover) { .list-item:hover { border-color: #4a5c6e; } }
        .list-item.selected { border-color: var(--accent-green); background: #142a20; }
        .list-item .id { font-weight: bold; font-size: 0.95rem; }
        .list-item .dest { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
        .badge { font-size: 0.65rem; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge.ontime { background: #163628; color: var(--accent-green); }
        .badge.delayed { background: #3b1b1b; color: var(--accent-red); }
        .badge.yokushi { background: #4a0000; color: #ff5555; border: 1px solid #ff0000; }

        /* 個別列車指令・通告パネル */
        .command-area { padding: 15px; background: var(--panel-bg); border-top: 2px solid #000; }
        .cmd-empty { color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 20px 0; }
        .cmd-details { display: none; }
        .cmd-details.active { display: block; }
        
        .c-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; border-bottom: 1px dashed var(--border-color); padding-bottom: 6px; }
        
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; font-weight: bold; }
        .flex-row { display: flex; gap: 6px; }
        .t-input, .t-select {
            flex: 1; padding: 8px; background: #080c11; border: 1px solid var(--border-color);
            color: #fff; border-radius: 4px; font-size: 0.85rem;
        }
        .t-textarea {
            width: 100%; padding: 8px; background: #080c11; border: 1px solid var(--accent-yellow);
            color: #fff; border-radius: 4px; font-size: 0.85rem; resize: vertical; min-height: 50px; margin-bottom: 5px;
        }

        .btn {
            background: #1e2833; color: #fff; border: 1px solid var(--border-color);
            padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap;
        }
        .btn:active { filter: brightness(0.7); }
        .btn-primary { background: #163628; border-color: #225940; color: var(--accent-green); }
        .btn-danger { background: #3b1b1b; border-color: #5c2424; color: var(--accent-red); }
        .btn-warning { background: #332b00; border-color: #665500; color: var(--accent-yellow); }
        .btn-send { width: 70px; }

        /* トースト */
        #sysToast {
            position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
            background: #1a2229; border: 1px solid var(--accent-green); color: #fff;
            padding: 10px 20px; border-radius: 6px; font-size: 0.85rem; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.7); transition: bottom 0.3s; z-index: 9999;
        }
        #sysToast.show { bottom: 30px; }
        #sysToast.error { border-color: var(--accent-red); }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .map-section { flex: 0 0 45vh; border-right: none; border-bottom: 2px solid #000; }
            .dashboard-section { width: 100%; flex: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>■ M.O.C.H.I. SYSTEM</h1>
            <span class="sub-logo">Management & Operation Command Hub Integration</span>
        </div>
        <div class="clock" id="sysClock">00:00:00</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" data-target="honsen">尾羽急本線</button>
        <button class="tab-btn" data-target="airport">空港線</button>
        <button class="tab-btn" data-target="imon">井問線</button>
        <button class="tab-btn" data-target="chidori">千鳥支線</button>
    </div>

    <div class="main-container">
        
        <div class="map-section">
            <!-- 尾羽急本線 -->
            <div class="map-wrapper active" id="wrap-honsen">
                <div class="map-inner" id="map-honsen" style="width: 2000px; height: 300px;">
                    <svg class="svg-map" width="2000" height="300" id="svg-honsen"></svg>
                    <!-- JavaScriptでここに列車アイコンが追加されます -->
                </div>
            </div>
            <!-- 空港線 -->
            <div class="map-wrapper" id="wrap-airport">
                <div class="map-inner" id="map-airport" style="width: 1500px; height: 360px;">
                    <svg class="svg-map" width="1500" height="360" id="svg-airport"></svg>
                </div>
            </div>
            <!-- 井問線 -->
            <div class="map-wrapper" id="wrap-imon">
                <div class="map-inner" id="map-imon" style="width: 1200px; height: 300px;">
                    <svg class="svg-map" width="1200" height="300" id="svg-imon"></svg>
                </div>
            </div>
            <!-- 千鳥支線 -->
            <div class="map-wrapper" id="wrap-chidori">
                <div class="map-inner" id="map-chidori" style="width: 1200px; height: 300px;">
                    <svg class="svg-map" width="1200" height="300" id="svg-chidori"></svg>
                </div>
            </div>
        </div>

        <div class="dashboard-section">
            
            <div class="panel-header">📝 運行状況モニター</div>
            <div class="train-list" id="ui-train-list"></div>

            <div class="panel-header">📡 個別列車 指令・通告パネル (ワンマン対応)</div>
            <div class="command-area">
                <div class="cmd-empty" id="ui-cmd-empty">リストかマップから列車を選択してください。</div>
                
                <div class="cmd-details" id="ui-cmd-details">
                    <div class="c-row"><span>対象列車:</span> <strong id="ui-dt-id">-</strong></div>
                    <div class="c-row"><span>基本行先:</span> <strong id="ui-dt-dest">-</strong></div>
                    <div class="c-row"><span>特記事項:</span> <strong id="ui-dt-special" style="color:var(--accent-yellow); font-size:0.75rem;">なし</strong></div>
                    <div class="c-row"><span>運行状態:</span> <span id="ui-dt-status">-</span></div>
                    
                    <!-- 1. 抑止 (緊急性が高いため最上部に配置) -->
                    <div class="input-group" style="margin-top: 15px; padding: 10px; background: #1a0808; border: 1px solid #4a1111; border-radius: 4px;">
                        <label style="color: #ff5555;">▶ 抑止 (運転見合わせ)</label>
                        <div class="flex-row">
                            <button class="btn btn-danger" style="flex:1;" onclick="cmdYokushi(true)">🛑 抑止を手配</button>
                            <button class="btn" style="flex:1; border-color:var(--accent-green); color:var(--accent-green);" onclick="cmdYokushi(false)">🟢 抑止解除</button>
                        </div>
                    </div>

                    <!-- 2. 行先・番線制御 -->
                    <div class="input-group" style="margin-top:15px;">
                        <label>▶ 変更 (行先 / 番線)</label>
                        <div class="flex-row">
                            <input type="text" id="in-dest" class="t-input" placeholder="行先 (例: 本郷)">
                            <button class="btn btn-primary btn-send" onclick="cmdSetDest()">送信</button>
                        </div>
                        <div class="flex-row" style="margin-top:6px;">
                            <input type="text" id="in-track" class="t-input" placeholder="番線 (例: 井口3番線)">
                            <button class="btn btn-primary btn-send" onclick="cmdSetTrack()">送信</button>
                        </div>
                    </div>

                    <!-- 3. 運転整理 (速度・停車) -->
                    <div class="input-group">
                        <label>▶ 運転整理 (速度 / 臨時停車等)</label>
                        <div class="flex-row">
                            <select id="in-limit" class="t-select">
                                <option value="0">制限なし (解除)</option>
                                <option value="25">25km/h 制限</option>
                                <option value="45">45km/h 制限</option>
                                <option value="65">65km/h 制限</option>
                            </select>
                            <button class="btn btn-warning btn-send" style="color:#000;" onclick="cmdSetLimit()">送信</button>
                        </div>
                        <div class="flex-row" style="margin-top:6px;">
                            <select id="in-delay" class="t-select">
                                <option value="0">定時 (解除)</option>
                                <option value="1">＋1分 延発</option>
                                <option value="3">＋3分 延発</option>
                                <option value="5">＋5分 延発</option>
                            </select>
                            <button class="btn btn-danger btn-send" onclick="cmdSetDelay()">送信</button>
                        </div>
                        <div class="flex-row" style="margin-top:6px;">
                            <input type="text" id="in-extra" class="t-input" placeholder="臨停/特通 (例: 梅郷 臨時停車)">
                            <button class="btn btn-primary btn-send" onclick="cmdSetExtra()">送信</button>
                        </div>
                    </div>

                    <!-- 4. テキスト通告 -->
                    <div class="input-group" style="background:#111811; padding:10px; border:1px solid #1a3322; border-radius:4px;">
                        <label style="color:var(--accent-green);">✉️ スタフ向け通告送信</label>
                        <textarea id="in-notice" class="t-textarea" placeholder="スタフ画面に赤枠で表示される通告事項..."></textarea>
                        <button class="btn btn-warning" style="width:100%; color:#000;" onclick="cmdSendNotice()">通告を発令</button>
                    </div>
                </div>
            </div>
            
            <div style="padding: 15px; border-top: 1px solid var(--border-color);">
                <button class="btn" style="background: #3b1b1b; color: #ff5555; border-color: #ff0000; width:100%;" onclick="showToast('⚠️ 【一斉指令】全線の非常停止(EB)を手配しました。', true)">【緊急】全線非常停止 (EB)</button>
            </div>
        </div>

    </div>

    <div id="sysToast"></div>

    <script>
        // ★ M.O.C.H.I. データストア (全ステータスを管理)
        const store = {
            selectedTrainId: null,
            trains: {
                "1001": { id: "1001レ", type: "快速", dest: "紀田行", route: "honsen", x: 400, y: 140, color: "var(--accent-green)", delay: 0, yokushi: false, limit: 0, track: "", extra: "", notice: "" },
                "3052": { id: "3052レ", type: "急行", dest: "尾羽原行", route: "honsen", x: 1650, y: 180, color: "var(--accent-yellow)", delay: 0, yokushi: false, limit: 0, track: "", extra: "", notice: "" },
                "A501": { id: "A501レ", type: "特急", dest: "高徳空港行", route: "airport", x: 850, y: 160, color: "var(--accent-blue)", delay: 0, yokushi: false, limit: 0, track: "", extra: "", notice: "" },
                "I202": { id: "I202レ", type: "普通", dest: "井口行", route: "imon", x: 800, y: 140, color: "var(--text-main)", delay: 0, yokushi: false, limit: 0, track: "", extra: "", notice: "" },
                "C101": { id: "C101レ", type: "各停", dest: "奥千鳥行", route: "chidori", x: 400, y: 160, color: "var(--accent-yellow)", delay: 0, yokushi: false, limit: 0, track: "", extra: "", notice: "" }
            }
        };

        // 時計更新
        setInterval(() => { document.getElementById('sysClock').innerText = new Date().toLocaleTimeString('ja-JP', {hour12: false}); }, 1000);

        let toastTimer;
        function showToast(msg, isError = false) {
            const t = document.getElementById('sysToast');
            t.innerText = msg;
            t.className = isError ? 'show error' : 'show';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.className = ''; }, 3000);
        }

        // ==========================================
        // UI 描画ロジック
        // ==========================================
        function renderAll() {
            renderList();
            renderIcons();
            renderCommandPanel();
        }

        function renderList() {
            const listEl = document.getElementById('ui-train-list');
            listEl.innerHTML = '';
            
            Object.keys(store.trains).forEach(key => {
                const tr = store.trains[key];
                const isSel = store.selectedTrainId === key ? 'selected' : '';
                
                let badge = `<span class="badge ontime">定時</span>`;
                if(tr.yokushi) badge = `<span class="badge yokushi">抑止中</span>`;
                else if(tr.delay > 0) badge = `<span class="badge delayed">+${tr.delay}分</span>`;

                const noticeIcon = (tr.notice || tr.track || tr.extra || tr.limit > 0) ? `⚠️` : ``;

                const div = document.createElement('div');
                div.className = `list-item ${isSel}`;
                div.onclick = () => selectTrain(key);
                div.innerHTML = `
                    <div>
                        <div class="id" style="color:${tr.color}">${tr.id} <span style="font-size:0.7rem;color:#fff">${tr.type}</span></div>
                        <div class="dest">${tr.dest} ${noticeIcon}</div>
                    </div>
                    <div>${badge}</div>
                `;
                listEl.appendChild(div);
            });
        }

        function renderIcons() {
            // アイコン描画前に古いものを全て消去
            document.querySelectorAll('.train-icon').forEach(icon => icon.remove());

            Object.keys(store.trains).forEach(key => {
                const tr = store.trains[key];
                const targetInner = document.getElementById(`map-${tr.route}`);
                
                // その路線がアクティブかどうかに関わらず、HTML内に配置しておく
                const isSel = store.selectedTrainId === key ? 'selected' : '';
                
                // 優先度: 抑止 > 遅れ > 徐行
                let statusClass = '';
                if(tr.yokushi) statusClass = 'stopped';
                else if(tr.delay > 0) statusClass = 'delayed';
                else if(tr.limit > 0) statusClass = 'slow';
                
                const div = document.createElement('div');
                div.className = `train-icon ${isSel} ${statusClass}`;
                div.style.left = `${tr.x}px`;
                div.style.top = `${tr.y}px`;
                if(!tr.yokushi && tr.delay === 0 && tr.limit === 0) div.style.borderColor = tr.color;
                
                div.onclick = () => selectTrain(key);
                div.innerHTML = `
                    <span>${key}</span>
                    <span class="t-type" style="color:${tr.color}">${tr.type}</span>
                `;
                targetInner.appendChild(div);
            });
        }

        function renderCommandPanel() {
            const empty = document.getElementById('ui-cmd-empty');
            const details = document.getElementById('ui-cmd-details');

            if (!store.selectedTrainId) {
                empty.style.display = 'block';
                details.classList.remove('active');
                return;
            }

            const tr = store.trains[store.selectedTrainId];
            empty.style.display = 'none';
            details.classList.add('active');

            document.getElementById('ui-dt-id').innerText = `${tr.id} (${tr.type})`;
            document.getElementById('ui-dt-id').style.color = tr.color;
            document.getElementById('ui-dt-dest').innerText = tr.dest;
            
            // 特記事項の生成
            let special = [];
            if(tr.track) special.push(`[番線] ${tr.track}`);
            if(tr.extra) special.push(`[臨停等] ${tr.extra}`);
            document.getElementById('ui-dt-special').innerText = special.length > 0 ? special.join(' / ') : "なし";

            // 運行状態の生成
            let statuses = [];
            if(tr.yokushi) statuses.push(`<span style="color:var(--accent-red);font-weight:bold;">🛑 抑止中</span>`);
            if(tr.delay > 0) statuses.push(`<span style="color:var(--accent-red);">+${tr.delay}分 延発</span>`);
            if(tr.limit > 0) statuses.push(`<span style="color:var(--accent-yellow);">⚡ ${tr.limit}km/h徐行</span>`);
            if(statuses.length === 0) statuses.push(`<span style="color:var(--accent-green);">🟢 通常運行</span>`);
            document.getElementById('ui-dt-status').innerHTML = statuses.join(' / ');

            // フォーム値の同期
            document.getElementById('in-dest').value = "";
            document.getElementById('in-track').value = tr.track;
            document.getElementById('in-limit').value = tr.limit;
            document.getElementById('in-delay').value = tr.delay;
            document.getElementById('in-extra').value = tr.extra;
            document.getElementById('in-notice').value = tr.notice;
        }

        // ==========================================
        // 指令アクション (M.O.C.H.I. コマンド群)
        // ==========================================
        function selectTrain(id) {
            store.selectedTrainId = id;
            const targetRoute = store.trains[id].route;
            
            // 自動で対象路線のタブを開く
            document.querySelectorAll('.tab-btn').forEach(b => {
                if(b.getAttribute('data-target') === targetRoute) b.click();
            });
            
            renderAll();
            
            // スマホ表示時、選択したら自動で下部のパネルへスクロール
            if(window.innerWidth <= 900) { 
                document.querySelector('.dashboard-section').scrollIntoView({ behavior: 'smooth' }); 
            }
        }

        function cmdYokushi(isOn) {
            const tr = store.trains[store.selectedTrainId];
            tr.yokushi = isOn;
            renderAll();
            if(isOn) showToast(`🛑 ${tr.id} 端末へ「運転見合わせ(抑止)」を緊急発報しました`, true);
            else showToast(`🟢 ${tr.id} の抑止を解除しました`);
        }

        function cmdSetDest() {
            const val = document.getElementById('in-dest').value.trim();
            if(!val) return showToast('行先を入力してください', true);
            const tr = store.trains[store.selectedTrainId];
            tr.dest = val;
            renderAll();
            showToast(`📡 ${tr.id} へ行先変更「${val}」を送信`);
        }

        function cmdSetTrack() {
            const val = document.getElementById('in-track').value.trim();
            const tr = store.trains[store.selectedTrainId];
            tr.track = val;
            renderAll();
            if(val) showToast(`📡 ${tr.id} へ番線変更「${val}」を送信`);
            else showToast(`📡 ${tr.id} の番線変更指示を解除しました`);
        }

        function cmdSetLimit() {
            const val = parseInt(document.getElementById('in-limit').value);
            const tr = store.trains[store.selectedTrainId];
            tr.limit = val;
            renderAll();
            if(val > 0) showToast(`⚡ ${tr.id} へ「${val}km/h徐行」を送信`);
            else showToast(`🟢 ${tr.id} の速度制限を解除しました`);
        }

        function cmdSetDelay() {
            const val = parseInt(document.getElementById('in-delay').value);
            const tr = store.trains[store.selectedTrainId];
            tr.delay = val;
            renderAll();
            if(val > 0) showToast(`📡 ${tr.id} へ＋${val}分延発を送信`);
            else showToast(`🟢 ${tr.id} の延発を解除しました`);
        }

        function cmdSetExtra() {
            const val = document.getElementById('in-extra').value.trim();
            const tr = store.trains[store.selectedTrainId];
            tr.extra = val;
            renderAll();
            if(val) showToast(`📡 ${tr.id} へ運転整理「${val}」を送信`);
            else showToast(`🟢 ${tr.id} の運転整理指示を解除しました`);
        }

        function cmdSendNotice() {
            const val = document.getElementById('in-notice').value.trim();
            const tr = store.trains[store.selectedTrainId];
            tr.notice = val;
            renderAll();
            if(val) showToast(`✉️ ${tr.id} 端末へ通告事項を発令しました`);
            else showToast(`✉️ ${tr.id} の通告を取り消しました`);
        }

        // ==========================================
        // マップと路線の描画
        // ==========================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.map-wrapper').forEach(m => m.classList.remove('active'));
                
                e.currentTarget.classList.add('active');
                const targetId = 'wrap-' + e.currentTarget.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        function drawMaps() {
            const mainL = `stroke="var(--rail-color)" stroke-width="4" fill="none"`;

            const pf = `fill="var(--platform-color)" rx="2"`;
            const txt = `fill="#fff" font-size="12"`;

            // 本線
            document.getElementById('svg-honsen').innerHTML = `
                <line x1="50" y1="140" x2="1950" y2="140" ${mainL}/>

                <rect x="100" y="187" width="80" height="8" ${pf}/>
                <text x="135" y="115" ${txt}>尾羽原</text>
                
                <path d="M 300 140 L 350 100 L 550 100 L 600 140" ${mainL}/>

                <rect x="380" y="115" width="140" height="10" ${pf}/>

                <path d="M 2650 140 L 2700 80 L 2900 80 L 2950 140" ${mainL}/>
                <rect x="2720" y="90" width="160" height="12" ${pf}/>
                <text x="2800" y="65" ${txt}>紀田</text>
            `;

            // 空港線
            document.getElementById('svg-airport').innerHTML = `
                <line x1="50" y1="160" x2="600" y2="160" ${mainL}/>
                <line x1="50" y1="200" x2="600" y2="200" ${mainL}/>
                <rect x="100" y="145" width="80" height="8" ${pf}/>
                <text x="140" y="135" ${txt}>高徳</text>
                
                <rect x="500" y="176" width="80" height="8" ${pf}/>
                <text x="540" y="150" ${txt}>高徳整備場北</text>

                <path d="M 600 200 L 650 260 L 1000 260" ${ugL}/>
                <path d="M 600 160 L 680 300 L 1000 300" ${ugL}/>
                
                <line x1="600" y1="160" x2="1000" y2="160" ${mainL}/>
                <line x1="600" y1="200" x2="1000" y2="200" ${mainL}/>

                <path d="M 800 160 L 750 100 L 650 100" stroke="#7a8c99" stroke-width="2.5" fill="none"/>
                <path d="M 780 160 L 730 80 L 650 80" stroke="#7a8c99" stroke-width="2.5" fill="none"/>
                <rect x="645" y="78" width="5" height="24" fill="var(--accent-yellow)"/>
                <text x="690" y="70" fill="#a0aab2" font-size="10">地上引上線</text>

                <rect x="1100" y="115" width="150" height="30" ${pf}/>
                <rect x="1100" y="175" width="150" height="10" ${pf}/>
                <rect x="1250" y="100" width="15" height="140" ${pf}/>
                <text x="1150" y="90" ${txt}>空港(地上)</text>

                <rect x="1100" y="270" width="150" height="20" ${pf}/>
                <rect x="1250" y="260" width="15" height="40" ${pf}/>
                <text x="1150" y="325" fill="var(--accent-blue)" font-size="12">空港(地下)</text>
            `;

            // 井問線
            document.getElementById('svg-imon').innerHTML = `
                <line x1="50" y1="140" x2="1150" y2="140" ${mainL}/>
                <line x1="50" y1="180" x2="1150" y2="180" ${mainL}/>
                <rect x="100" y="125" width="80" height="8" ${pf}/>
                <text x="140" y="115" ${txt}>井口</text>
                <rect x="400" y="125" width="80" height="8" ${pf}/>
                <text x="440" y="115" ${txt}>参田町</text>
                <rect x="800" y="125" width="80" height="8" ${pf}/>
                <text x="840" y="115" ${txt}>本郷</text>
                <rect x="1050" y="125" width="80" height="8" ${pf}/>
                <text x="1090" y="115" ${txt}>千鳥</text>
            `;

            // 千鳥支線
            document.getElementById('svg-chidori').innerHTML = `
                <line x1="50" y1="160" x2="1300" y2="160" ${mainL}/>
                <rect x="100" y="145" width="60" height="8" ${pf}/>
                <text x="130" y="135" ${txt}>千鳥</text>

                <path d="M 250 160 Q 280 120 320 120 L 380 120 Q 420 120 450 160" ${mainL}/>

                <path d="M 550 160 Q 580 120 620 120 L 680 120" stroke="var(--accent-red)" stroke-width="3" fill="none"/>
                <rect x="620" y="135" width="60" height="10" fill="var(--accent-red)" rx="2"/>
                <text x="650" y="110" ${txt}>奥千鳥</text>
            `;
        }

        window.onload = function() {
            drawMaps();
            renderAll();
        };
    </script>
</body>
</html>
